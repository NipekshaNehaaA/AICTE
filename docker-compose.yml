version: '3.8'

services:
  # =========================================================================
  # 1. POSTGRESQL 16 (WITH NATIVE ROW-LEVEL SECURITY INITIALIZATION)
  # =========================================================================
  db:
    image: postgres:16-alpine
    container_name: aicte_postgres_rls
    restart: always
    environment:
      POSTGRES_DB: aicte_workflow_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_master_password_2026
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/app/schema_rls_postgres.sql:/docker-entrypoint-initdb.d/01_init_rls.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d aicte_workflow_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # =========================================================================
  # 2. FASTAPI BACKEND (RULES ENGINE, ISOLATED AI LAYER & AUDIT TRAIL)
  # =========================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aicte_fastapi_backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_healthy
    environment:
      ENV: production
      DATABASE_URL: postgresql://aicte_app_user:secure_aicte_app_pass_2026@db:5432/aicte_workflow_db
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: aicte_sih26262_super_secure_key_2026_jwt_token_sign_high_entropy_32char_minimum
      JWT_SECRET_KEY: aicte_sih26262_super_secure_key_2026_jwt_token_sign_high_entropy_32char_minimum
      STORAGE_BACKEND: minio
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: aicte_minio_admin
      MINIO_SECRET_KEY: aicte_minio_secure_pass_2026
      MINIO_BUCKET: aicte-documents
      MINIO_SECURE: "false"
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_USER: ""
      SMTP_PASSWORD: ""
      SMTP_FROM: compliance-notifications@aicte-india.org
      DEMO_MODE: "false"
      EVALUATOR_MODE: "false"
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

  # =========================================================================
  # 3. NEXT.JS FRONTEND (CHERRY BLOSSOM SURFACES + INK WASH TYPOGRAPHY)
  # =========================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aicte_nextjs_frontend
    restart: always
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"

  # =========================================================================
  # 4. REDIS (TASK QUEUE & SCHEDULER BROKER)
  # =========================================================================
  redis:
    image: redis:7-alpine
    container_name: aicte_redis
    restart: always
    ports:
      - "6379:6379"

  # =========================================================================
  # 5. MINIO (S3-COMPATIBLE REGULATORY DOCUMENT STORAGE)
  # =========================================================================
  minio:
    image: minio/minio:RELEASE.2024-01-18T22-51-28Z
    container_name: aicte_minio_s3
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: aicte_minio_admin
      MINIO_ROOT_PASSWORD: aicte_minio_secure_pass_2026
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  # =========================================================================
  # 6. MAILPIT (REAL SMTP SERVER FOR NOTIFICATION TESTING & DEMO)
  # =========================================================================
  mailpit:
    image: axllent/mailpit:latest
    container_name: aicte_mailpit
    restart: always
    ports:
      - "1025:1025" # SMTP port
      - "8025:8025" # Web UI

volumes:
  pgdata:
  miniodata:
